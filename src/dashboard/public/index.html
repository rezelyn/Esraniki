<!doctype html>
<html lang="en" data-theme="mocha">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Esraniki</title>
        <link rel="icon" id="favicon" href="https://cdn.discordapp.com/avatars/1489402395384615102/bac3179cc24c78bfbc969201caaf8186.png?size=256">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
        <script type="module" src="./backend/app.js"></script>
        <script type="style" src="./shared/style.js"></script>
    </head>

    <body>
        <div id="auth-modal" class="modal-overlay">
            <div id="login-bg" class="login-bg" aria-hidden="true">
                <div class="login-bg-sidebar">
                    <div class="login-bg-brand">
                        <div class="skel skel-avatar"></div>
                        <div class="skel skel-line" style="width:80px"></div>
                    </div>
                    <div class="login-bg-guild">
                        <div class="skel skel-icon-sm"></div>
                        <div class="skel skel-line" style="width:90px"></div>
                    </div>
                    <div class="login-bg-nav">
                        <div class="skel skel-nav-item" style="width:55%"></div>
                        <div class="skel skel-nav-section"></div>
                        <div class="skel skel-nav-item" style="width:70%"></div>
                        <div class="skel skel-nav-item" style="width:60%"></div>
                        <div class="skel skel-nav-item" style="width:65%"></div>
                        <div class="skel skel-nav-section"></div>
                        <div class="skel skel-nav-item" style="width:55%"></div>
                    </div>
                </div>
                
                <div class="login-bg-content">
                    <div class="login-bg-cards">
                        <div class="login-bg-card wide">
                            <div class="skel skel-line" style="width:40%;height:14px;margin-bottom:1rem"></div>
                            <div class="skel skel-line" style="width:100%;height:10px"></div>
                            <div class="skel skel-line" style="width:80%;height:10px;margin-top:.5rem"></div>
                        </div>
                        <div class="login-bg-card">
                            <div class="skel skel-line" style="width:50%;height:12px;margin-bottom:.75rem"></div>
                            <div class="skel skel-line" style="width:90%;height:10px"></div>
                        </div>
                        <div class="login-bg-card">
                            <div class="skel skel-line" style="width:45%;height:12px;margin-bottom:.75rem"></div>
                            <div class="skel skel-line" style="width:80%;height:10px"></div>
                        </div>
                        <div class="login-bg-card wide">
                            <div class="skel skel-line" style="width:35%;height:12px;margin-bottom:.75rem"></div>
                            <div style="display:flex;gap:.75rem">
                                <div class="skel skel-line" style="flex:1;height:10px"></div>
                                <div class="skel skel-line" style="flex:1;height:10px"></div>
                                <div class="skel skel-line" style="flex:1;height:10px"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal">
                <img id="login-avatar" class="login-avatar" src="" alt="">
                    <label class="label-text">Esraniki</label>
                    <label class="label-hint" id="login-hint">You need to log in to your Discord account in order to have access to the dashboard.</label>
                <div id="auth-error" style="display:none;color:var(--red);font-size:.8rem;margin-bottom:.75rem"></div>
                <a class="btn primary" id="login-link" href="/auth/login" target="_top">Log in with Discord</a>
                <div class="spinner alt" id="activity-spinner" style="display:none"></div>
                <button class="btn primary" id="activity-retry-btn" type="button" style="display:none">Retry</button>
            </div>
        </div>

        <div id="shell">
            <nav id="sidebar">
                <div class="sidebar-brand">
                    <img id="sidebar-avatar" class="sidebar-avatar" src="" alt="">
                    <div class="sidebar-brand-meta">
                        <span>Esraniki</span>
                        <span class="sidebar-version" id="sidebar-version"></span>
                    </div>
                    <button class="btn small" id="theme-toggle" type="button"><i data-lucide="palette" class="icon"></i></button>
                </div>

                <div class="dropdown-menu" id="guild-picker">
                    <div class="spinner alt"></div>
                </div>

                <ul class="sidebar-nav">
                    <li><a href="#home" class="sidebar-nav link" data-page="home"><i data-lucide="house" class="icon"></i>Home</a></li>
                    <li><a href="#stats" class="sidebar-nav link" data-page="stats"><i data-lucide="bar-chart-2" class="icon"></i>Statistics</a></li>
                    <li><a href="#rules" class="sidebar-nav link" data-page="rules"><i data-lucide="scroll-text" class="icon"></i>Rules</a></li>
                    <li class="label-option" id="sidebar-nav">Integrations</li>
                    <li><a href="#minecraft" class="sidebar-nav link" data-page="minecraft"><i data-lucide="sword"></i>Minecraft</a></li>
                    <li><a href="#twitch" class="sidebar-nav link" data-page="twitch"><i data-lucide="tv-2" class="icon"></i>Twitch</a></li>
                    <li class="label-option" id="sidebar-nav">Games</li>
                    <li><a href="#shrimp" class="sidebar-nav link" data-page="shrimp"><i data-lucide="shrimp" class="icon"></i>Pass The Shrimp Down</a></li>
                </ul>

                <div class="sidebar-footer">
                    <div class="sidebar-user" id="sidebar-user"><img class="sidebar-user-avatar" id="sidebar-user-avatar" src="" alt=""><span class="sidebar-user-name" id="sidebar-user-name"></span></div>
                    <button class="btn danger full" id="logout-btn"><i data-lucide="log-out" class="icon"></i>Log out</button>
                    <label class="label-hint" id="sidebar-copyright">Copyright © Rezelyn 2026 - GPL 3.0
                        <a class="label-hyperlink" href="https://esraniki.space/tos" target="_blank" rel="noopener noreferrer">Terms of Service</a>
                        <span> • </span>
                        <a class="label-hyperlink" href="https://esraniki.space/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
                        <span> • </span>
                        <a class="label-hyperlink" href="https://esraniki.space/legal" target="_blank" rel="noopener noreferrer">Legal</a>
                    </label>
                </div>
            </nav>

            <div id="content-wrap">
                <main id="content"></main>
            </div>
        </div>
    </body>
</html>
